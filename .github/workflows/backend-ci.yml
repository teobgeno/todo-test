name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
  push:
    branches: [main]
    paths:
      - 'backend/**'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test

      - name: Run migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_NAME: test_db
        run: npm run migration:run

      - name: Run e2e tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_NAME: test_db
          FRONTEND_URL: http://localhost:5173
          PORT: 3000
        run: npm run test:e2e

      - run: npm run build

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::958085379190:role/todoapp-github-actions-role
          aws-region: us-east-1

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -t 958085379190.dkr.ecr.us-east-1.amazonaws.com/todoapp/backend-repo:${{ github.sha }} .
          docker build -t 958085379190.dkr.ecr.us-east-1.amazonaws.com/todoapp/backend-repo:latest .
          docker push 958085379190.dkr.ecr.us-east-1.amazonaws.com/todoapp/backend-repo:${{ github.sha }}
          docker push 958085379190.dkr.ecr.us-east-1.amazonaws.com/todoapp/backend-repo:latest