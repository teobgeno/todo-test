name: Deploy

on:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::958085379190:role/todoapp-github-actions-role
          aws-region: us-east-1

      - name: Trigger deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-04166d893a8b46a04" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy triggered by ${{ github.event.workflow_run.name }}" \
            --parameters 'commands=["cd /home/ec2-user/app && git pull && bash deploy/deploy.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for command to finish..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-04166d893a8b46a04" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-04166d893a8b46a04" \
            --query "Status" \
            --output text)

          echo "=== Deploy script stdout ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-04166d893a8b46a04" \
            --query "StandardOutputContent" \
            --output text

          echo "=== Deploy script stderr ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-04166d893a8b46a04" \
            --query "StandardErrorContent" \
            --output text

          echo "Final status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-04166d893a8b46a04" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy triggered by ${{ github.event.workflow_run.name }}" \
            --parameters 'commands=["cd /home/ec2-user/app && git pull && bash deploy/deploy.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for command to finish..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-04166d893a8b46a04"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-04166d893a8b46a04" \
            --query "Status" \
            --output text)

          echo "=== Deploy script output ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-04166d893a8b46a04" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "=== Deploy script error output ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-04166d893a8b46a04" \
              --query "StandardErrorContent" \
              --output text
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi

          echo "Deploy succeeded."